# Regenerates each SDK and opens a PR in its repo. The SDK repo's own CI
# (pytest + Gauge conformance) then gates the merge.
# Triggered by couchdb-openapi releases, by changes here, or manually.
name: generate
on:
  repository_dispatch:
    types: [spec-released]
  workflow_dispatch:
    inputs:
      spec_ref: { description: "couchdb-openapi ref (default: sdk-matrix.yaml)", default: "" }
  push:
    branches: [main]
    paths: ["config/**", "templates/**", "openapitools.json", "scripts/**"]

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env: { TOKEN: "${{ secrets.SDK_BOT_TOKEN }}" }
        run: |
          if [ -n "$TOKEN" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::SDK_BOT_TOKEN is not set; skipping SDK regeneration (see SETUP.md)"; fi

  generate:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lang: [python]
    steps:
      - uses: actions/checkout@v4
        with: { path: couchdb-sdk-generator }
      - id: spec
        # A dispatched or released ref wins; otherwise sdk-matrix.yaml pins the spec.
        env:
          REQUESTED: ${{ github.event.client_payload.spec_ref || inputs.spec_ref }}
        run: |
          ref="${REQUESTED:-$(awk '/^  ref:/{print $2; exit}' couchdb-sdk-generator/sdk-matrix.yaml)}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/couchdb-openapi
          ref: ${{ steps.spec.outputs.ref }}
          path: couchdb-openapi
          token: ${{ secrets.SDK_BOT_TOKEN }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/couchdb-${{ matrix.lang }}
          token: ${{ secrets.SDK_BOT_TOKEN }}
          path: couchdb-${{ matrix.lang }}
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd couchdb-sdk-generator && npm ci
      - run: bash couchdb-sdk-generator/scripts/generate.sh ${{ matrix.lang }}
      - uses: peter-evans/create-pull-request@v7
        with:
          path: couchdb-${{ matrix.lang }}
          token: ${{ secrets.SDK_BOT_TOKEN }}
          branch: regen/spec-${{ steps.spec.outputs.ref }}
          title: "Regenerate from couchdb-openapi@${{ steps.spec.outputs.ref }}"
          commit-message: "chore: regenerate from couchdb-openapi@${{ steps.spec.outputs.ref }}"
          body: Automated regeneration by couchdb-sdk-generator. CI runs pytest and the Gauge conformance suite.
