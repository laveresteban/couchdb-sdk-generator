# Which spec version to build from, and where each SDK lives.
spec:
  repo: couchdb-openapi
  ref: main            # pin to a tag (e.g. v0.1.0) for reproducible releases
languages:
  python:
    generator: python
    config: config/python.yaml
    repo: couchdb-python
  typescript:
    generator: typescript
    config: config/typescript.yaml
    repo: couchdb-node
